<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Mira — новый чат</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&amp;family=Inter+Tight:wght@500..700&amp;display=swap">
<style>
body{margin:0;background:#FFFFFF}
a{color:#1F3BD6}a:hover{color:#152CA8}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid #1F3BD6;outline-offset:2px}
.ib{display:grid;place-items:center;border:0;background:transparent;color:#5C5F67;border-radius:10px;cursor:pointer;transition:background .15s ease,color .15s ease}
.ib:hover{background:#EDEDF0;color:#0E0F12}
.row{transition:background .15s ease}
.row:hover{background:#EDEDF0}
.chip{border:1px solid #E4E4E8;background:#FFFFFF;color:#3E4148;transition:background .15s ease,border-color .15s ease,color .15s ease}
.chip:hover{background:#F6F6F7}
.chip[data-on="true"]{background:#EEF1FE;border-color:#D3DAFB;color:#1F3BD6}
.sugg{transition:background .15s ease,border-color .15s ease,transform .15s ease}
.sugg:hover{background:#F7F7F8;border-color:#D9D9DE}
.composer{transition:border-color .15s ease,box-shadow .15s ease}
.composer:focus-within{border-color:#C8CCD6;box-shadow:0 1px 2px rgba(14,15,18,.05),0 12px 32px rgba(14,15,18,.08)}
textarea{font:inherit}
textarea::placeholder{color:#73767E}
textarea:focus{outline:none}
.msg{animation:rise .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.thinking{background:linear-gradient(90deg,#8A8D95 0%,#0E0F12 45%,#8A8D95 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 1.8s linear infinite}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.86);opacity:.6}}
@media (max-width:860px){.side{height:auto !important;flex-basis:100% !important;border-right:0 !important;border-bottom:1px solid #E9E9EC}.side-hide{display:none !important}}
</style>
</helmet>
<div style="width: 100%; min-height: 100vh; display: flex; flex-wrap: wrap; background: #FFFFFF; color: #0E0F12; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased">

  <aside class="side" aria-label="Чаты" style="flex: 1 1 272px; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; padding: 10px 10px 12px; background: #F7F7F8; border-right: 1px solid #E9E9EC">
    <div style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 8px">
      <svg width="26" height="26" viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M10 50V31a11 11 0 0 1 22 0a11 11 0 0 1 22 0V50" stroke="#1F3BD6" stroke-width="9" stroke-linejoin="round"></path><circle cx="32" cy="44" r="5" fill="#FF5A4E"></circle></svg>
      <span style="font-family: 'Inter Tight', 'Inter', sans-serif; font-size: 19px; font-weight: 650; letter-spacing: -0.03em">Mira</span>
      <span style="flex: 1"></span>
      <button class="ib" type="button" aria-label="Скрыть боковую панель" style="width: 36px; height: 36px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M9 4v16"></path></svg>
      </button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px; margin-top: 6px">
      <button class="row" type="button" onClick="{{reset}}" style="height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border: 0; border-radius: 10px; background: #EDEDF0; font-size: 14px; font-weight: 550; cursor: pointer; text-align: left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"></path><path d="M17.5 3.5a2.1 2.1 0 0 1 3 3L13 14l-4 1 1-4z"></path></svg>
        <span style="flex: 1">Новый чат</span>
        <span style="font-size: 12px; font-weight: 500; color: #6B6E76">⌘K</span>
      </button>
      <button class="row" type="button" style="height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; font-size: 14px; cursor: pointer; text-align: left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m20 20-4.2-4.2"></path></svg>
        <span>Поиск по чатам</span>
      </button>
      <button class="row" type="button" style="height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; font-size: 14px; cursor: pointer; text-align: left">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span>Проекты</span>
      </button>
    </div>

    <nav class="side-hide" aria-label="История" style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; margin-top: 18px">
      <p style="margin: 0 10px 6px; font-size: 12px; font-weight: 550; color: #6B6E76">Сегодня</p>
      <button class="row" type="button" style="height: 36px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; font-size: 14px; color: #2A2D33; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer">Разбор идеи кофейни</button>
      <button class="row" type="button" style="height: 36px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; font-size: 14px; color: #2A2D33; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer">План подготовки к экзамену</button>
      <p style="margin: 16px 10px 6px; font-size: 12px; font-weight: 550; color: #6B6E76">Вчера</p>
      <button class="row" type="button" style="height: 36px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; font-size: 14px; color: #2A2D33; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer">Письмо арендодателю</button>
      <button class="row" type="button" style="height: 36px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; font-size: 14px; color: #2A2D33; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer">Тьюринг-баттл, раунд 3</button>
      <p style="margin: 16px 10px 6px; font-size: 12px; font-weight: 550; color: #6B6E76">Последние 7 дней</p>
      <button class="row" type="button" style="height: 36px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; font-size: 14px; color: #2A2D33; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer">Как работает память Mira</button>
      <button class="row" type="button" style="height: 36px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; font-size: 14px; color: #2A2D33; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer">Сырники без муки</button>
      <button class="row" type="button" style="height: 36px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent; font-size: 14px; color: #2A2D33; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer">Сравнение ноутбуков для учёбы</button>
    </nav>

    <button class="row side-hide" type="button" style="height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border: 0; border-radius: 12px; background: transparent; cursor: pointer; text-align: left">
      <span style="width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 50%; background: #E3E7FC; color: #1F3BD6; font-size: 13px; font-weight: 600">Вы</span>
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25">
        <span style="font-size: 14px; font-weight: 550">Мой профиль</span>
        <span style="font-size: 12px; color: #6B6E76">Бесплатный план</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C5F67" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
    </button>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; height: 100vh; display: flex; flex-direction: column; background: #FFFFFF">
    <header style="height: 56px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px">
      <button class="ib" type="button" style="height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 12px; color: #0E0F12; font-size: 16px; font-weight: 600; letter-spacing: -0.01em">
        <span>Mira 1.0</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B6E76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
      <span style="flex: 1"></span>
      <button class="ib" type="button" aria-label="Временный чат" style="width: 40px; height: 40px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="3.2 3" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle></svg>
      </button>
    </header>

    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ true }}">
      <div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 24px 64px">
        <div style="width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 28px">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center">
            <svg width="48" height="48" viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M10 50V31a11 11 0 0 1 22 0a11 11 0 0 1 22 0V50" stroke="#1F3BD6" stroke-width="9" stroke-linejoin="round"></path><circle cx="32" cy="44" r="5" fill="#FF5A4E"></circle></svg>
            <h1 style="margin: 0; font-family: 'Inter Tight', 'Inter', sans-serif; font-size: 40px; line-height: 1.1; font-weight: 600; letter-spacing: -0.035em">Добрый вечер. Чем займёмся?</h1>
          </div>

          <div class="composer" style="display: flex; flex-direction: column; gap: 6px; padding: 12px 12px 10px 16px; border: 1px solid #E2E2E6; border-radius: 26px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(14,15,18,.04), 0 10px 28px rgba(14,15,18,.06)">
            <label for="composerHero" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Сообщение для Mira</label>
            <textarea id="composerHero" rows="2" placeholder="Спросите что угодно…" value="{{draft}}" onChange="{{onDraft}}" onKeyDown="{{onKey}}" ref="{{setInput}}" style="width: 100%; box-sizing: border-box; min-height: 52px; padding: 6px 4px; border: 0; resize: none; background: transparent; color: #0E0F12; font-size: 16px; line-height: 24px"></textarea>
            <div style="display: flex; align-items: center; gap: 6px">
              <button class="ib" type="button" aria-label="Прикрепить файл или фото" style="width: 40px; height: 40px; border: 1px solid #E4E4E8; border-radius: 50%">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
              </button>
              <button class="chip" type="button" data-on="{{searchOn}}" aria-pressed="{{searchOn}}" onClick="{{toggleSearch}}" style="height: 40px; display: flex; align-items: center; gap: 7px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"></path></svg>
                Поиск
              </button>
              <button class="chip" type="button" data-on="{{thinkOn}}" aria-pressed="{{thinkOn}}" onClick="{{toggleThink}}" style="height: 40px; display: flex; align-items: center; gap: 7px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer">
                <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"></path></svg>
                Подумать глубже
              </button>
              <span style="flex: 1"></span>
              <button class="ib" type="button" aria-label="Голосовой ввод" style="width: 40px; height: 40px; border-radius: 50%">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
              </button>
              <sc-if value="{{canSend}}" hint-placeholder-val="{{ false }}">
                <button type="button" aria-label="Отправить" onClick="{{send}}" style="width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 50%; background: {{accent}}; color: #FFFFFF; cursor: pointer">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
                </button>
              </sc-if>
              <sc-if value="{{idle}}" hint-placeholder-val="{{ true }}">
                <button type="button" aria-label="Отправить" disabled style="width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 50%; background: #ECECEF; color: #9A9CA3; cursor: default">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
                </button>
              </sc-if>
            </div>
          </div>

          <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px">
            <button class="sugg" type="button" onClick="{{pickIdea}}" style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 1px solid #E4E4E8; border-radius: 999px; background: #FFFFFF; font-size: 14px; color: #3E4148; cursor: pointer">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FF5A4E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"></path></svg>
              Разобрать идею
            </button>
            <button class="sugg" type="button" onClick="{{pickWrite}}" style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 1px solid #E4E4E8; border-radius: 999px; background: #FFFFFF; font-size: 14px; color: #3E4148; cursor: pointer">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1F3BD6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"></path><path d="m13.5 6.5 4 4"></path></svg>
              Написать текст
            </button>
            <button class="sugg" type="button" onClick="{{pickExplain}}" style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 1px solid #E4E4E8; border-radius: 999px; background: #FFFFFF; font-size: 14px; color: #3E4148; cursor: pointer">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#1E8A5E" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6.5 12 3l9 3.5-9 3.5z"></path><path d="M7 8.5V14c0 1.5 2.2 3 5 3s5-1.5 5-3V8.5M21 6.5V12"></path></svg>
              Объяснить сложное
            </button>
            <button class="sugg" type="button" onClick="{{pickTuring}}" style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border: 1px solid #E4E4E8; border-radius: 999px; background: #FFFFFF; font-size: 14px; color: #3E4148; cursor: pointer">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8A4BD6" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h10a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H9l-4 3v-3H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"></path><path d="M19 9h1a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-1v3l-4-3h-3"></path></svg>
              Тьюринг-баттл
            </button>
          </div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{hasMessages}}" hint-placeholder-val="{{ false }}">
      <div ref="{{setScroll}}" style="flex: 1; min-height: 0; overflow-y: auto; padding: 24px 24px 16px">
        <div style="max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px">
          <sc-for list="{{messages}}" as="m" hint-placeholder-count="0">
            <sc-if value="{{m.isUser}}" hint-placeholder-val="{{ true }}">
              <div class="msg" style="display: flex; justify-content: flex-end">
                <div style="max-width: 75%; padding: 10px 16px; border-radius: 22px; background: #F1F1F3; font-size: 16px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere">{{m.text}}</div>
              </div>
            </sc-if>
            <sc-if value="{{m.isMira}}" hint-placeholder-val="{{ false }}">
              <article class="msg" style="display: flex; gap: 14px; align-items: flex-start">
                <svg width="26" height="26" viewBox="0 0 64 64" fill="none" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M10 50V31a11 11 0 0 1 22 0a11 11 0 0 1 22 0V50" stroke="#1F3BD6" stroke-width="9" stroke-linejoin="round"></path><circle cx="32" cy="44" r="5" fill="#FF5A4E"></circle></svg>
                <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
                  <p style="margin: 0; font-size: 16px; line-height: 1.7; color: #1A1C21">{{m.text}}</p>
                  <div style="display: flex; gap: 2px; margin-left: -8px">
                    <button class="ib" type="button" aria-label="Скопировать" style="width: 32px; height: 32px; border-radius: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2.5"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg></button>
                    <button class="ib" type="button" aria-label="Хороший ответ" style="width: 32px; height: 32px; border-radius: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v10H4V10zM7 10l4-7a2 2 0 0 1 3 2l-1 4h6a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.8 20H7"></path></svg></button>
                    <button class="ib" type="button" aria-label="Плохой ответ" style="width: 32px; height: 32px; border-radius: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 14V4H4v10zM7 14l4 7a2 2 0 0 0 3-2l-1-4h6a2 2 0 0 0 2-2.3l-1.2-7A2 2 0 0 0 17.8 4H7"></path></svg></button>
                    <button class="ib" type="button" aria-label="Ответить заново" style="width: 32px; height: 32px; border-radius: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8.5"></path><path d="M20 3.5v5h-5"></path></svg></button>
                  </div>
                </div>
              </article>
            </sc-if>
          </sc-for>
          <sc-if value="{{thinking}}" hint-placeholder-val="{{ false }}">
            <div class="msg" style="display: flex; gap: 14px; align-items: center">
              <svg class="pulse" width="26" height="26" viewBox="0 0 64 64" fill="none" aria-hidden="true" style="flex: none"><path d="M10 50V31a11 11 0 0 1 22 0a11 11 0 0 1 22 0V50" stroke="#1F3BD6" stroke-width="9" stroke-linejoin="round"></path><circle cx="32" cy="44" r="5" fill="#FF5A4E"></circle></svg>
              <span class="thinking" role="status" style="font-size: 15px; font-weight: 500">Mira думает…</span>
            </div>
          </sc-if>
        </div>
      </div>

      <div style="flex: none; padding: 0 24px 12px">
        <div class="composer" style="max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; padding: 10px 10px 10px 16px; border: 1px solid #E2E2E6; border-radius: 26px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(14,15,18,.04), 0 10px 28px rgba(14,15,18,.06)">
          <label for="composerDock" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">Сообщение для Mira</label>
          <textarea id="composerDock" rows="1" placeholder="Ответить Mira…" value="{{draft}}" onChange="{{onDraft}}" onKeyDown="{{onKey}}" ref="{{setInput}}" style="width: 100%; box-sizing: border-box; min-height: 36px; padding: 6px 4px; border: 0; resize: none; background: transparent; color: #0E0F12; font-size: 16px; line-height: 24px"></textarea>
          <div style="display: flex; align-items: center; gap: 6px">
            <button class="ib" type="button" aria-label="Прикрепить файл или фото" style="width: 40px; height: 40px; border: 1px solid #E4E4E8; border-radius: 50%">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
            <button class="chip" type="button" data-on="{{searchOn}}" aria-pressed="{{searchOn}}" onClick="{{toggleSearch}}" style="height: 40px; display: flex; align-items: center; gap: 7px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"></path></svg>
              Поиск
            </button>
            <button class="chip" type="button" data-on="{{thinkOn}}" aria-pressed="{{thinkOn}}" onClick="{{toggleThink}}" style="height: 40px; display: flex; align-items: center; gap: 7px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 500; cursor: pointer">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"></path></svg>
              Подумать глубже
            </button>
            <span style="flex: 1"></span>
            <sc-if value="{{canSend}}" hint-placeholder-val="{{ false }}">
              <button type="button" aria-label="Отправить" onClick="{{send}}" style="width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 50%; background: {{accent}}; color: #FFFFFF; cursor: pointer">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
              </button>
            </sc-if>
            <sc-if value="{{idle}}" hint-placeholder-val="{{ true }}">
              <button type="button" aria-label="Отправить" disabled style="width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 50%; background: #ECECEF; color: #9A9CA3; cursor: default">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
              </button>
            </sc-if>
            <sc-if value="{{busy}}" hint-placeholder-val="{{ false }}">
              <button type="button" aria-label="Остановить ответ" onClick="{{stop}}" style="width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 50%; background: #0E0F12; color: #FFFFFF; cursor: pointer">
                <svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="4" fill="currentColor"></rect></svg>
              </button>
            </sc-if>
          </div>
        </div>
      </div>
    </sc-if>

    <p style="flex: none; margin: 0; padding: 0 16px 14px; text-align: center; font-size: 12px; color: #6B6E76">Mira может ошибаться. Проверяйте важное.</p>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F3BD6","options":["#1F3BD6","#0E0F12","#FF5A4E"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  state = { draft: '', messages: [], thinking: false, search: false, think: false, replies: 0 };

  componentDidUpdate() {
    if (this.scrollEl) this.scrollEl.scrollTop = this.scrollEl.scrollHeight;
  }

  componentWillUnmount() {
    clearTimeout(this.timer);
  }

  fill(text) {
    this.setState({ draft: text }, () => { if (this.inputEl) this.inputEl.focus(); });
  }

  reply() {
    const replies = [
      'Это кликабельный прототип, поэтому отвечаю заготовкой. Обратите внимание на сам ответ: он идёт без «пузыря» и на всю ширину колонки — длинный текст так читается как статья, а не как переписка.',
      'Пока я «думаю», вместо кнопки отправки появляется «Стоп» — ответ можно прервать в любой момент. Кнопка «Новый чат» слева вернёт к стартовому экрану.',
      'В настоящем продукте здесь появится ответ модели — постепенно, по мере генерации, с заголовками, списками и блоками кода.'
    ];
    return replies[this.state.replies % replies.length];
  }

  send() {
    const text = (this.state.draft || '').trim();
    if (!text || this.state.thinking) return;
    this.setState({ messages: this.state.messages.concat([{ role: 'user', text }]), draft: '', thinking: true });
    clearTimeout(this.timer);
    this.timer = setTimeout(() => {
      this.setState({
        thinking: false,
        replies: this.state.replies + 1,
        messages: this.state.messages.concat([{ role: 'mira', text: this.reply() }])
      });
    }, 1500);
  }

  renderVals() {
    const s = this.state;
    const accent = this.props.accent ?? '#1F3BD6';
    const hasText = (s.draft || '').trim().length > 0;
    const has = s.messages.length > 0 || s.thinking;
    return {
      accent,
      draft: s.draft,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => {
        const composing = e.nativeEvent && e.nativeEvent.isComposing;
        if (e.key === 'Enter' && !e.shiftKey && !composing) { e.preventDefault(); this.send(); }
      },
      setInput: (el) => { if (el) this.inputEl = el; },
      setScroll: (el) => { this.scrollEl = el; },
      send: () => this.send(),
      stop: () => { clearTimeout(this.timer); this.setState({ thinking: false }); },
      canSend: hasText && !s.thinking,
      idle: !hasText && !s.thinking,
      busy: s.thinking,
      isEmpty: !has,
      hasMessages: has,
      thinking: s.thinking,
      messages: s.messages.map((m) => ({ text: m.text, isUser: m.role === 'user', isMira: m.role === 'mira' })),
      searchOn: s.search,
      thinkOn: s.think,
      toggleSearch: () => this.setState({ search: !s.search }),
      toggleThink: () => this.setState({ think: !s.think }),
      pickIdea: () => this.fill('Разбери мою идею: '),
      pickWrite: () => this.fill('Помоги написать текст: '),
      pickExplain: () => this.fill('Объясни простыми словами: '),
      pickTuring: () => this.fill('Давай проведём Тьюринг-баттл'),
      reset: () => { clearTimeout(this.timer); this.setState({ messages: [], draft: '', thinking: false }); }
    };
  }
}
</script>
</body>
