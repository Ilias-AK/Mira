<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fd">
  <meta name="color-scheme" content="light">
  <title>Mira 1.0</title>
  <link rel="stylesheet" href="/app.css?v=9">
</head>
<body>
  <a class="skip-link" href="#composerInput">Перейти к сообщению</a>

  <div class="app" id="app">
    <aside class="rail" aria-label="Основная навигация">
      <button class="rail-brand" type="button" aria-label="Mira" data-new-chat>
        <img src="/assets/mira-mark-cobalt.png" alt="">
      </button>

      <nav class="rail-nav" aria-label="Разделы">
        <button class="rail-button active" id="threadPanelButton" type="button" aria-label="Показать или скрыть диалоги" aria-current="page" aria-expanded="true" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5.5 18.5 3 21v-5.3A8.5 8.5 0 0 1 4.5 3h15A1.5 1.5 0 0 1 21 4.5v10a1.5 1.5 0 0 1-1.5 1.5H8.8a8.4 8.4 0 0 1-3.3 2.5Z"/></svg>
        </button>
        <button class="rail-button" type="button" aria-label="Коллекции">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m4 8 8-4 8 4-8 4-8-4Z"/><path d="m4 12 8 4 8-4M4 16l8 4 8-4"/></svg>
        </button>
        <button class="rail-button" type="button" aria-label="О Мире">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H12v17H6.5A2.5 2.5 0 0 0 4 22V5.5ZM20 5.5A2.5 2.5 0 0 0 17.5 3H12v17h5.5A2.5 2.5 0 0 1 20 22V5.5Z"/></svg>
        </button>
      </nav>

      <button class="rail-button rail-settings" type="button" aria-label="Настройки">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9.8 3.4 10.5 2h3l.7 1.4 1.5.6 1.5-.5 2.1 2.1-.5 1.5.6 1.5 1.4.7v3l-1.4.7-.6 1.5.5 1.5-2.1 2.1-1.5-.5-1.5.6-.7 1.4h-3l-.7-1.4-1.5-.6-1.5.5-2.1-2.1.5-1.5-.6-1.5-1.4-.7v-3l1.4-.7.6-1.5-.5-1.5 2.1-2.1 1.5.5 1.5-.6Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </aside>

    <aside class="thread-sidebar" id="sidebar" aria-label="Диалоги">
      <div class="wordmark">
        <img src="/assets/mira-mark-cobalt.png" alt="">
        <span>Mira</span>
        <button class="sidebar-toggle" id="sidebarCollapseButton" type="button" aria-label="Свернуть диалоги" aria-expanded="true" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14 7-5 5 5 5"/></svg>
        </button>
      </div>

      <button class="new-chat" id="newChatButton" type="button">
        <span class="plus" aria-hidden="true"></span>
        <span>Новый диалог</span>
      </button>

      <div class="sidebar-section">
        <p class="section-label">Недавние</p>
        <nav class="thread-list" aria-label="История диалогов">
          <button class="thread-item active" id="currentThread" type="button" aria-current="page">
            <span id="currentThreadLabel">Новый диалог</span>
          </button>
          <button class="thread-item" type="button" data-prompt="Как меня зовут?">
            <span>Как меня зовут</span>
          </button>
          <button class="thread-item" type="button" data-prompt="Расскажи немного о себе">
            <span>Знакомство с Мирой</span>
          </button>
        </nav>
      </div>
    </aside>

    <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Закрыть меню"></button>

    <main class="main">
      <header class="topbar">
        <button class="icon-button menu-button" id="sidebarButton" type="button" aria-label="Открыть диалоги" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>

        <h1 class="conversation-title" id="conversationTitle">Новый диалог</h1>
        <div class="model-picker">
          <button class="model-button" id="modelButton" type="button" aria-expanded="false" aria-controls="modelMenu">
            <span>Mira 1.0</span>
            <span class="chevron" aria-hidden="true"></span>
          </button>
          <div class="model-menu" id="modelMenu" role="dialog" aria-label="Выбор модели">
            <p>Текущая модель</p>
            <button class="model-option" type="button" aria-current="true">
              <img src="/assets/mira-mark-cobalt.png" alt="">
              <span>Mira 1.0</span>
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 10 3 3 7-7"/></svg>
            </button>
          </div>
        </div>
        <div class="topbar-spacer"></div>
      </header>

      <div class="notice" id="notice" role="status" aria-live="polite"></div>

      <div class="chat-scroll" id="chatScroll">
        <section class="conversation" id="conversation" aria-label="Диалог с Mira">
          <div class="welcome" id="welcome">
            <img class="welcome-mark" src="/assets/mira-mark-cobalt.png" alt="">
            <p class="welcome-kicker">Mira 1.0</p>
            <h2>Ну что, поговорим?</h2>
            <p class="welcome-copy">Пиши как есть. Я тоже без официоза)</p>
          </div>
        </section>
      </div>

      <button class="scroll-bottom-button" id="scrollBottomButton" type="button" aria-label="К последнему сообщению" hidden>
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
      </button>

      <footer class="composer-shell">
        <form class="composer" id="composer">
          <div class="composer-tools">
            <button class="add-button" id="addButton" type="button" aria-label="Дополнительные действия" aria-expanded="false" aria-controls="addMenu">
              <span class="plus" aria-hidden="true"></span>
            </button>
            <div class="add-menu" id="addMenu" role="menu">
              <button type="button" role="menuitem" data-new-chat>
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                Новый диалог
              </button>
              <button type="button" role="menuitem" data-fill-prompt="Расскажи что-нибудь неожиданное о себе">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 3 1.6 5.4L19 10l-5.4 1.6L12 17l-1.6-5.4L5 10l5.4-1.6L12 3Z"/></svg>
                Подсказать вопрос
              </button>
            </div>
          </div>

          <textarea id="composerInput" rows="1" maxlength="500" placeholder="Напиши что-нибудь…" aria-label="Сообщение Mira"></textarea>
          <span class="character-count" id="characterCount" aria-live="polite"></span>
          <button class="send-button" id="sendButton" type="submit" aria-label="Отправить сообщение" disabled>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m4 12 15-7-4 14-3.2-5.2L4 12Z"/><path d="m11.8 13.8 3.6-4"/></svg>
          </button>
        </form>
      </footer>
    </main>
  </div>

  <template id="userMessageTemplate">
    <div class="message-row user-row"><div class="user-bubble"></div></div>
  </template>

  <template id="assistantMessageTemplate">
    <article class="message-row assistant-row">
      <img class="assistant-mark" src="/assets/mira-mark-cobalt.png" alt="">
      <div class="assistant-content">
        <div class="assistant-label">Mira</div>
        <div class="assistant-text"></div>
        <div class="message-meta">
          <button class="copy-button" type="button" aria-label="Скопировать ответ">
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="6.5" y="6.5" width="9" height="9" rx="2"/><path d="M13.5 6V5a2 2 0 0 0-2-2h-6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h1"/></svg>
          </button>
          <span class="response-time"></span>
        </div>
      </div>
    </article>
  </template>

  <template id="thinkingTemplate">
    <article class="message-row assistant-row thinking-row" aria-live="polite">
      <img class="assistant-mark" src="/assets/mira-mark-cobalt.png" alt="">
      <div class="thinking-content">
        <strong>Mira думает</strong>
        <span class="thinking-dots" aria-label="Mira формирует ответ"><i></i><i></i><i></i></span>
      </div>
    </article>
  </template>

  <script src="/app.js?v=9" defer></script>
</body>
</html>
